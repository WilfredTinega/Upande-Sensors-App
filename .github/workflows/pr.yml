name: PR Checks

# Every pull request into the release branch is validated here: the code has to
# lint, the Expo dependency tree has to be coherent, the Android project has to
# actually compile, and the commits have to say what version they produce.
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint & dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check Expo dependency versions
        run: npx expo install --check

      - name: Expo doctor
        run: npx expo-doctor
        continue-on-error: true

  version:
    name: Version gate
    runs-on: ubuntu-latest
    steps:
      # The version script walks history back to the last v* tag, so a shallow
      # clone would make it compute the wrong bump.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Commit style no longer decides the version — every merge is one step —
      # but it is what groups the generated release notes into sections.
      - name: Require conventional commit subjects
        run: |
          set -euo pipefail
          base=$(git merge-base origin/${{ github.base_ref }} HEAD)
          bad=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            if ! printf '%s' "$subject" | grep -qiE '^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'; then
              echo "::error::Non-conventional commit subject: $subject"
              bad=1
            fi
          done < <(git log "$base"..HEAD --no-merges --format=%s)
          if [ "$bad" -ne 0 ]; then
            echo "Commit subjects must look like 'feat(scope): description'."
            echo "Allowed types: feat fix perf refactor docs style test build ci chore revert"
            exit 1
          fi
          echo "All commit subjects are conventional."

      - name: Compute next version
        id: next
        run: node scripts/version.mjs --json | tee version.json

      - name: Summarise the release this PR would produce
        run: |
          set -euo pipefail
          {
            echo "### Version impact"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Current | \`$(jq -r .current version.json)\` |"
            echo "| Next | \`$(jq -r .version version.json)\` |"
            echo "| versionCode | \`$(jq -r .versionCode version.json)\` |"
            echo
            echo "Merging this PR into \`${{ github.base_ref }}\` builds and publishes a signed APK."
            echo "Version advances one odometer step per merge (patch rolls over at 100, minor at 50)."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - uses: gradle/actions/setup-gradle@v4

      # Debug-signed: this is a reviewer preview, not something we ship. It
      # proves the native project still assembles before the merge lands.
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: upande-sensors-pr-${{ github.event.pull_request.number }}-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
