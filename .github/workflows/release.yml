name: Release

# Merging into the release branch cuts a release: advance the version by one
# odometer step, prebuild the native project, assemble a signed APK with the
# real upload keystore, tag it, and attach the APK to a GitHub Release.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      bump:
        description: Skip ahead to the next round number instead of the usual +1 patch
        required: false
        type: choice
        default: auto
        options: [auto, patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    # The version bump commit is pushed back to this same branch; without this
    # guard it would trigger an endless release loop.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Verify signing secrets are configured
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Run ./scripts/setup-signing.sh once to generate the keystore and upload them."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Apply version bump
        id: version
        run: |
          set -euo pipefail
          bump="${{ github.event.inputs.bump || 'auto' }}"
          if [ "$bump" = "auto" ]; then
            node scripts/version.mjs --apply
          else
            node scripts/version.mjs --apply --bump "$bump"
          fi
          node scripts/version.mjs --keep-version --json > version.json
          {
            echo "version=$(jq -r .version version.json)"
            echo "tag=$(jq -r .tag version.json)"
            echo "version_code=$(jq -r .versionCode version.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: node scripts/version.mjs --keep-version --notes > RELEASE_NOTES.md

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Assemble signed release APK
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PUPANDE_STORE_FILE="$RUNNER_TEMP/release.keystore" \
            -PUPANDE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PUPANDE_KEY_ALIAS="$KEY_ALIAS" \
            -PUPANDE_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Confirm the APK is signed with the upload key
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          "$apksigner" verify --print-certs "$apk"

      - name: Name the artifact after the release
        id: apk
        run: |
          set -euo pipefail
          src=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          dest="upande-sensors-${{ steps.version.outputs.version }}.apk"
          mv "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Always keep the APK, even if publishing fails
        uses: actions/upload-artifact@v4
        with:
          name: upande-sensors-${{ steps.version.outputs.version }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Remove the generated native project before committing
        run: rm -rf android version.json

      - name: Commit and tag the version bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `expo prebuild` rewrites the android/ios scripts once a native
          # directory exists. Throw that away and re-apply only the version, so
          # the release commit carries the bump and nothing else.
          git checkout -- package.json
          npm pkg set version="${{ steps.version.outputs.version }}"
          git add app.json package.json
          git commit -m "chore(release): ${{ steps.version.outputs.version }} [skip ci]"
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "Upande Sensors ${{ steps.version.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Upande Sensors ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true

      - name: Job summary
        run: |
          {
            echo "### Released \`${{ steps.version.outputs.tag }}\`"
            echo
            echo "- versionCode \`${{ steps.version.outputs.version_code }}\`"
            echo "- APK: \`${{ steps.apk.outputs.path }}\`"
            echo "- https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
