name: Release

# Merging into the release branch cuts a release: advance the version by one
# odometer step, prebuild the native project, assemble a signed APK with the
# real upload keystore, tag it, and attach the APK to a GitHub Release.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      bump:
        description: Skip ahead to the next round number instead of the usual +1 patch
        required: false
        type: choice
        default: auto
        options: [auto, patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    # The version bump commit is pushed back to this same branch; without this
    # guard it would trigger an endless release loop.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # Signing is optional. With all four secrets present the APK is signed with
      # the upload key; without them the build still runs and Gradle falls back
      # to the debug key, which installs fine for sideloading but cannot go to
      # Play. Adding the secrets later upgrades releases automatically — but see
      # the warning below about the key change.
      - name: Detect signing configuration
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] &&
             [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Upload keystore configured — the APK will be release-signed."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets set. The APK will be signed with Android's \
          public debug key: installable by sideload, but not publishable to Play, and anyone \
          can build an 'upgrade' for it. Run ./scripts/upload-secrets.sh to sign properly."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Apply version bump
        id: version
        run: |
          set -euo pipefail
          bump="${{ github.event.inputs.bump || 'auto' }}"
          if [ "$bump" = "auto" ]; then
            node scripts/version.mjs --apply
          else
            node scripts/version.mjs --apply --bump "$bump"
          fi
          node scripts/version.mjs --keep-version --json > version.json
          {
            echo "version=$(jq -r .version version.json)"
            echo "tag=$(jq -r .tag version.json)"
            echo "version_code=$(jq -r .versionCode version.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: node scripts/version.mjs --keep-version --notes > RELEASE_NOTES.md

      # Must run before prebuild: this is what the APK's embedded manifest
      # carries, and it is how the in-app update check knows which repo to ask.
      - name: Stamp the source repository into the build
        run: node scripts/stamp-build.mjs --repo "$GITHUB_REPOSITORY"

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        if: steps.signing.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Assemble release APK
        working-directory: android
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # The -P properties are what switch the signing plugin from the debug
          # fallback to the upload key; omitting them entirely is the fallback.
          if [ "$SIGNED" = "true" ]; then
            ./gradlew assembleRelease --no-daemon \
              -PUPANDE_STORE_FILE="$RUNNER_TEMP/release.keystore" \
              -PUPANDE_STORE_PASSWORD="$STORE_PASSWORD" \
              -PUPANDE_KEY_ALIAS="$KEY_ALIAS" \
              -PUPANDE_KEY_PASSWORD="$KEY_PASSWORD"
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Check the signing certificate
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          EXPECTED_SHA256: ${{ secrets.ANDROID_KEY_SHA256 }}
        run: |
          set -euo pipefail
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"

          # Unsigned mode is a deliberate choice, so a debug certificate is the
          # expected outcome rather than a failure. Only verify the key when we
          # asked for one.
          if [ "$SIGNED" != "true" ]; then
            echo "::warning::This APK is debug-signed (no upload key configured)."
            exit 0
          fi

          # `verify --print-certs` alone proves only that the APK is signed by
          # *something*. The signing plugin falls back to the debug key when its
          # -P properties are missing, so without a comparison a build that
          # silently lost its key would sail through.
          if grep -qi 'CN=Android Debug' <<<"$certs"; then
            echo "::error::APK is signed with the Android debug key, not the upload key." >&2
            exit 1
          fi

          if [ -n "${EXPECTED_SHA256:-}" ]; then
            actual=$(grep -i 'certificate SHA-256 digest' <<<"$certs" | head -1 |
              awk -F': ' '{print tolower($2)}' | tr -d ' ')
            expected=$(tr 'A-Z' 'a-z' <<<"$EXPECTED_SHA256" | tr -d ' :')
            if [ "$actual" != "$expected" ]; then
              echo "::error::Signing certificate $actual does not match the expected upload key." >&2
              exit 1
            fi
            echo "Signing certificate matches the expected upload key."
          else
            echo "::warning::ANDROID_KEY_SHA256 is not set — only the debug-key check ran." >&2
          fi

      - name: Name the artifact after the release
        id: apk
        run: |
          set -euo pipefail
          src=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          dest="upande_sensors_v${{ steps.version.outputs.version }}.apk"
          mv "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"
          echo "name=${dest%.apk}" >> "$GITHUB_OUTPUT"

      - name: Always keep the APK, even if publishing fails
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Remove the generated native project before committing
        run: rm -rf android version.json

      - name: Commit and tag the version bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `expo prebuild` rewrites the android/ios scripts once a native
          # directory exists. Throw that away and re-apply only the version, so
          # the release commit carries the bump and nothing else.
          git checkout -- package.json
          # `npm version` rather than `npm pkg set version`: the latter leaves
          # package-lock.json's own root version behind, which then shows up as
          # unrelated noise in the next PR that touches dependencies.
          npm version "${{ steps.version.outputs.version }}" \
            --no-git-tag-version --allow-same-version
          git add app.json package.json package-lock.json
          git commit -m "chore(release): ${{ steps.version.outputs.version }} [skip ci]"
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "Upande Sensors ${{ steps.version.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "${{ steps.version.outputs.tag }}"

      # Whoever downloads the APK is the one who has to trust it, so the signing
      # status belongs in the release body, not just in the build log.
      - name: Note debug signing in the release body
        if: steps.signing.outputs.signed != 'true'
        run: |
          {
            echo
            echo "---"
            echo
            echo "> **Debug-signed build.** This APK is signed with Android's public debug"
            echo "> key, not a private upload key. Sideload it (you may need to allow"
            echo "> \"Install unknown apps\"); it cannot be published to Google Play, and"
            echo "> it will not install over a build signed with a different key."
          } >> RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Upande Sensors ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true

      - name: Job summary
        run: |
          {
            echo "### Released \`${{ steps.version.outputs.tag }}\`"
            echo
            echo "- versionCode \`${{ steps.version.outputs.version_code }}\`"
            echo "- APK: \`${{ steps.apk.outputs.path }}\`"
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "- Signing: upload key"
            else
              echo "- Signing: **debug key** (no signing secrets configured)"
            fi
            echo "- https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
